name: Bug
description: Something that worked, or should work, and doesn't.
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Phone or desktop, which screen, what you tapped.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, Sentry links, file:line.
    validations:
      required: true
