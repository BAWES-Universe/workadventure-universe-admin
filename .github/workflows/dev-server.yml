name: Dev server

# Puts a pull request's code on the dev server (https://dev.bawes.net) for testing.
#
# - Add the `on-dev` label to a PR: its branch is built and dev's Orbit app switches to it.
#   Dev has one Orbit slot, so labelling a PR takes the label off any other open PR.
# - Push to a labelled PR: it is rebuilt and dev follows.
# - Remove the label, merge or close the PR: dev returns to the latest develop build.
# - Run it by hand (Actions > Dev server > Run workflow) to put any branch of this repo on dev.
#
# The game repo has the same workflow and switches only the dev game apps, so a game PR and an
# Orbit PR can be on dev at the same time. Orbit PR migrations apply to the dev database. PRs from forks are ignored.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to put on dev (develop returns dev to the default)
        required: true
        default: develop

# One run per PR at a time; a newer push to the same PR waits and replaces any older queued run.
# Never cancel a running one: it may be part-way through switching dev's apps.
concurrency:
  group: dev-server-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LABEL: on-dev
  DEFAULT_BRANCH: develop

jobs:
  decide:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    outputs:
      branch: ${{ steps.decide.outputs.branch }}
      pr: ${{ steps.decide.outputs.pr }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'on-dev') }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          branch=""; pr=""
          # Every GitHub read is a plain assignment, so a failed call fails this step (set -e)
          # instead of being read as "no PR holds the label".
          holders=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "$LABEL" --json number --jq ".[].number")

          if [ "$EVENT" = workflow_dispatch ]; then
            branch="$INPUT_BRANCH"
          elif [ "$ACTION" = labeled ] && [ "$EVENT_LABEL" = "$LABEL" ]; then
            branch="$HEAD_REF"; pr="$PR"
            # Single slot: take the label off every other open PR.
            for other in $holders; do
              [ "$other" = "$PR" ] && continue
              gh pr edit "$other" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL"
              gh pr comment "$other" --repo "$GITHUB_REPOSITORY" --body "Dev was taken over by #$PR, so this PR is no longer on dev. Add \`$LABEL\` again to put it back."
            done
          elif [ "$ACTION" = synchronize ] && [ "$HAS_LABEL" = true ]; then
            branch="$HEAD_REF"; pr="$PR"
          elif { [ "$ACTION" = unlabeled ] && [ "$EVENT_LABEL" = "$LABEL" ]; } || \
               { [ "$ACTION" = closed ] && [ "$HAS_LABEL" = true ]; }; then
            # Another open PR still holding the label keeps dev; returning to default would throw it off.
            others=$(printf '%s\n' $holders | grep -vx "${PR:-0}" || true)
            if [ -n "$others" ]; then
              echo "Another PR holds $LABEL; leaving dev on it."
            else
              branch="$DEFAULT_BRANCH"
            fi
          fi

          if [ "$branch" = main ] || [ "$branch" = master ]; then
            echo "::error::$branch is the production branch; it never goes on dev through this workflow"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Decision: branch='${branch:-none}' pr='${pr:-none}'"

  build:
    needs: decide
    if: needs.decide.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.decide.outputs.branch }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            # develop images are built on every push to it; use the moving tag.
            echo "tag=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run docker-build.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docker-build.yml \
              --branch "$BRANCH" --event workflow_dispatch --limit 5 --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started\")] | sort_by(.createdAt) | last | .databaseId // empty")
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::Could not find the image build for $BRANCH"
            exit 1
          fi
          echo "Building images: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null

          sha=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          # Same tag docker/metadata-action writes for `type=sha,prefix={{branch}}-`: the branch
          # with anything outside [A-Za-z0-9._-] replaced by '-', then the short sha.
          tag=$(printf '%s-%s' "$BRANCH" "${sha::7}" | sed -E 's/[^A-Za-z0-9._-]+/-/g')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # A PR may have lost the label (another PR took dev) while its images were building.
  recheck:
    needs: [decide, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.recheck.outputs.go }}
    steps:
      - id: recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.decide.outputs.pr }}
        run: |
          go=true
          if [ -n "$PR" ]; then
            # A plain assignment, so a failed call fails the step instead of reading as "label gone".
            labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels,state \
                     --jq "select(.state == \"OPEN\") | .labels[].name")
            if ! grep -qx "$LABEL" <<< "$labels"; then
              echo "#$PR no longer holds $LABEL; not switching."
              go=false
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  switch:
    needs: [decide, build, recheck]
    if: needs.recheck.outputs.go == 'true'
    permissions:
      contents: read
      packages: read
      pull-requests: write
    uses: ./.github/workflows/dev-server-switch.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      pr: ${{ needs.decide.outputs.pr }}
      sha: ${{ needs.build.outputs.sha }}
    secrets: inherit
